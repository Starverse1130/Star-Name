<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star-Name</title>

    <!-- PWA -->
    <meta name="theme-color" content="#0a0e27">
    <link rel="manifest" href="manifest.json">

    <!-- Favicon -->
    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Starfield Background -->
    <div class="stars" id="stars"></div>

    <!-- Main Card -->
    <div class="card" id="mainCard">
        <div class="card-glow"></div>
        <div class="card-content">
            <div class="logo-wrap">
                <img src="images/Starverse.jpeg" alt="Starverse Logo" class="logo">
                <div class="logo-ring"></div>
            </div>
            <h1>Hello, Stranger!</h1>
            <p class="subtitle">Tell me your name to join the <span class="accent">Starverse</span></p>
            <div class="input-group">
                <input type="text" id="nameInput" placeholder="Enter your name" autocomplete="off" maxlength="30">
                <div class="input-border"></div>
            </div>
            <button id="starBtn" class="btn-primary" disabled>
                <span class="btn-text">Star</span>
                <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <!-- Popup Overlay -->
    <div class="overlay" id="overlay"></div>

    <!-- Welcome Popup Card -->
    <div class="popup" id="popup" role="dialog" aria-modal="true" aria-labelledby="popupHeading">
        <div class="popup-glow"></div>
        <button class="popup-close" id="popupClose" aria-label="Close">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
        <div class="popup-content">
            <div class="welcome-icon">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                </svg>
            </div>
            <h2 id="popupHeading">Welcome, <span id="userName"></span>!</h2>
            <p class="popup-subtitle">You are now part of the <span class="accent">Starverse</span> family.</p>
            <div class="popup-divider"></div>
            <button class="btn-starverse" id="starverseBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                    <polyline points="15 3 21 3 21 9"></polyline>
                    <line x1="10" y1="14" x2="21" y2="3"></line>
                </svg>
                Access Starverse
            </button>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast" role="status" aria-live="polite">
        <div class="toast-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
        </div>
        <div class="toast-content">
            <span class="toast-title">Coming Soon</span>
            <span class="toast-desc">Starverse is launching soon. Stay tuned!</span>
        </div>
    </div>

    <!-- Service Worker -->
    <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js")
        .then(() => console.log("PWA Ready ✅"));
    }
    </script>

    <!-- App Script -->
    <script src="script.js"></script>
</body>
</html>
